[build-system]
requires = [
    "scikit-build-core >=0.10",
    "nanobind >=2.10.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "attpc-flow-cpp"
version = "0.1.0"
description = "Analysis tool for AT-TPC in workflow."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "kinstaky" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
# Setuptools-style build caching in a local directory
build-dir = "build"
# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"
# python package
wheel.packages = ["python/attpc_flow_cpp"]

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "**/CMakeLists.txt" },
    { file = "include/**/*.h"},
    { file = "external/**/*.hpp" },
    { file = "src/**/*.cpp" },
    { file = "extensions/**/*.cpp" },
]