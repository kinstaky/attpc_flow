[package]
name = "attpc_merger_wrapper"
version = "0.1.0"
edition = "2024"

[lib]
name = "_lib"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
hdf5 = { package = "hdf5-metno", version = "0.12.3" }
libattpc_merger = { git = "https://github.com/kinstaky/attpc_merger.git", tag = "v1.1.1" }
pyo3 = "0.28.0"
rusqlite = "0.38.0"
spdlog-rs = "0.4.1"
zmq = "0.10"